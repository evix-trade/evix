[package]
name = "evix-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for the Evix execution layer"
license = "MIT"

[dependencies]
alloy = { version = "0.9", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
